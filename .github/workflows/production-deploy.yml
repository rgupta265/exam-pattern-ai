name: Production Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build & Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Install dependencies
        run: npm ci

      - name: 4. Generate Prisma Client
        run: npm run prisma:generate

      - name: 5. Translation validation
        run: npm run check-translations

      - name: 6. TypeScript check
        run: npm run typecheck

      - name: 7. ESLint check
        run: npm run lint

      - name: 8. Vitest unit & integration tests
        run: npm test

      - name: 9. Next.js standalone production build
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1

      - name: 10. Assemble and validate standalone deployment bundle
        run: |
          echo "Validating build output..."
          test -f .next/BUILD_ID || { echo "❌ Missing .next/BUILD_ID"; exit 1; }
          test -f .next/standalone/server.js || { echo "❌ Missing .next/standalone/server.js"; exit 1; }

          echo "Preparing clean deployment distribution..."
          rm -rf deploy-dist
          mkdir -p deploy-dist/.next/standalone/.next deploy-dist/tmp

          echo "1. Copying standalone base files..."
          cp -r .next/standalone/* deploy-dist/.next/standalone/

          echo "2. Copying complete .next artifacts (static, server, BUILD_ID, manifests) into standalone/.next..."
          cp -r .next/static deploy-dist/.next/standalone/.next/static
          cp -r .next/server deploy-dist/.next/standalone/.next/server
          cp .next/BUILD_ID deploy-dist/.next/standalone/.next/BUILD_ID
          cp .next/*.json deploy-dist/.next/standalone/.next/

          echo "3. Copying application assets (public, messages, prisma)..."
          if [ -d "public" ]; then
            cp -r public deploy-dist/.next/standalone/
          fi

          if [ -d "messages" ]; then
            cp -r messages deploy-dist/.next/standalone/
          fi

          if [ -d "prisma" ]; then
            cp -r prisma deploy-dist/.next/standalone/
          fi

          echo "4. Copying app.js startup wrapper..."
          cp app.js deploy-dist/app.js
          cp app.js deploy-dist/.next/standalone/app.js

          echo "5. Writing restart signal..."
          echo "Deployment timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC') - Commit: ${{ github.sha }}" > deploy-dist/tmp/restart.txt

          echo "Validating final deployment distribution..."
          test -f deploy-dist/.next/standalone/.next/BUILD_ID || { echo "❌ Validation failed: .next/standalone/.next/BUILD_ID missing"; exit 1; }
          test -f deploy-dist/.next/standalone/.next/routes-manifest.json || { echo "❌ Validation failed: routes-manifest.json missing"; exit 1; }
          test -f deploy-dist/.next/standalone/server.js || { echo "❌ Validation failed: standalone server.js missing"; exit 1; }
          test -d deploy-dist/.next/standalone/node_modules || { echo "❌ Validation failed: standalone node_modules missing"; exit 1; }
          test -d deploy-dist/.next/standalone/.next/static || { echo "❌ Validation failed: standalone static missing"; exit 1; }
          test -f deploy-dist/app.js || { echo "❌ Validation failed: app.js missing"; exit 1; }
          test -f deploy-dist/tmp/restart.txt || { echo "❌ Validation failed: tmp/restart.txt missing"; exit 1; }

          echo "Artifact structure validated successfully!"

          echo "6. Packing into a single archive for a fast, reliable FTP transfer..."
          echo "   (uploading ~2,700 individual files one-by-one over FTP was taking 15+ minutes"
          echo "    and was the previous bottleneck between build success and the health check)"
          tar -czf deploy-package.tar.gz -C deploy-dist .
          ls -lh deploy-package.tar.gz

      - name: 11. Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-package
          path: deploy-package.tar.gz
          retention-days: 1

  deploy-to-cpanel:
    name: Deploy to cPanel (FTPS & Passenger)
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout repository for deployment script
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Install basic-ftp
        run: npm install basic-ftp

      - name: 4. Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-package
          path: .

      - name: 5. Deploy to cPanel via Node.js Secure FTPS
        env:
          CPANEL_FTP_SERVER: ${{ secrets.CPANEL_FTP_SERVER || secrets.CPANEL_HOST || '103.224.246.193' }}
          CPANEL_FTP_USERNAME: ${{ secrets.CPANEL_FTP_USERNAME || secrets.CPANEL_USERNAME || 'rupakgup' }}
          CPANEL_FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD || secrets.CPANEL_PASSWORD }}
          CPANEL_FTP_PORT: ${{ secrets.CPANEL_FTP_PORT || 21 }}
          CPANEL_FTP_APP_DIR: ${{ secrets.CPANEL_FTP_APP_DIR || './' }}
        run: node scripts/deploy-ftp.js

      - name: 6. Health Check & Verification
        env:
          HEALTH_URL: "https://aiexam.rupakgupta.com/api/health"
          LOGIN_URL: "https://aiexam.rupakgupta.com/en/login"
        run: |
          echo "Waiting 12 seconds for Passenger application worker to reload..."
          sleep 12

          HEALTH_PASSED=false
          for i in {1..8}; do
            echo "Health check attempt $i/8: Requesting $HEALTH_URL..."
            HTTP_STATUS=$(curl -s -o /tmp/health_response.json -w "%{http_code}" "$HEALTH_URL" || echo "000")
            echo "HTTP Status: $HTTP_STATUS"

            if [ "$HTTP_STATUS" = "200" ]; then
              cat /tmp/health_response.json
              echo ""
              HEALTH_PASSED=true
              break
            fi

            echo "Application still reloading... retrying in 5 seconds."
            sleep 5
          done

          if [ "$HEALTH_PASSED" != "true" ]; then
            echo "❌ Health check FAILED after 8 attempts!"
            exit 1
          fi

          echo "Health check: PASS"

          echo "Verifying canonical route $LOGIN_URL..."
          LOGIN_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$LOGIN_URL" || echo "000")
          echo "Login Route HTTP Status: $LOGIN_STATUS"

          echo ""
          echo "=================================================="
          echo "Build: PASS"
          echo "Tests: PASS"
          echo "Artifact: PASS"
          echo "FTPS Upload: PASS"
          echo "Passenger restart: PASS"
          echo "Health check: PASS"
          echo "=================================================="
          echo "Deployment successful"
          echo "Commit: ${{ github.sha }}"
          echo "URL: https://aiexam.rupakgupta.com"
          echo "=================================================="
