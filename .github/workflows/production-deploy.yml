name: Production Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build & Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Install dependencies
        run: npm ci

      - name: 4. Generate Prisma Client
        run: npm run prisma:generate

      - name: 5. Translation validation
        run: npm run check-translations

      - name: 6. TypeScript check
        run: npm run typecheck

      - name: 7. ESLint check
        run: npm run lint

      - name: 8. Vitest unit & integration tests
        run: npm test

      - name: 9. Next.js standalone production build
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1

      - name: 10. Assemble and validate standalone deployment bundle
        run: |
          echo "Validating standalone build output..."
          test -f .next/standalone/server.js || { echo "❌ Missing .next/standalone/server.js"; exit 1; }

          echo "Copying static assets into standalone bundle..."
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static

          if [ -d "public" ]; then
            echo "Copying public directory..."
            cp -r public .next/standalone/
          fi

          if [ -d "messages" ]; then
            echo "Copying messages directory..."
            cp -r messages .next/standalone/
          fi

          if [ -d "prisma" ]; then
            echo "Copying prisma directory..."
            cp -r prisma .next/standalone/
          fi

          if [ -f "app.js" ]; then
            echo "Copying app.js startup wrapper..."
            cp app.js .next/standalone/app.js
          fi

          mkdir -p .next/standalone/tmp
          echo "Deployment timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC') - Commit: ${{ github.sha }}" > .next/standalone/tmp/restart.txt

          echo "Validating final standalone bundle structure..."
          test -f .next/standalone/server.js || { echo "❌ Validation failed: server.js missing"; exit 1; }
          test -f .next/standalone/app.js || { echo "❌ Validation failed: app.js missing"; exit 1; }
          test -d .next/standalone/node_modules || { echo "❌ Validation failed: standalone node_modules missing"; exit 1; }
          test -d .next/standalone/.next/static || { echo "❌ Validation failed: .next/static missing"; exit 1; }
          test -f .next/standalone/tmp/restart.txt || { echo "❌ Validation failed: tmp/restart.txt missing"; exit 1; }

          echo "Artifact structure validated successfully!"

      - name: 11. Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-dist
          path: .next/standalone/
          retention-days: 1

  deploy-to-cpanel:
    name: Deploy to cPanel (FTPS & Passenger)
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: 1. Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-dist
          path: deploy-dist

      - name: 2. Deploy to cPanel via Secure FTPS (Port 21)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER || secrets.CPANEL_HOST || '103.224.246.193' }}
          username: ${{ secrets.CPANEL_FTP_USERNAME || secrets.CPANEL_USERNAME || 'rupakgup' }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD || secrets.CPANEL_PASSWORD }}
          port: ${{ secrets.CPANEL_FTP_PORT || 21 }}
          protocol: ftps
          security: loose
          local-dir: ./deploy-dist/
          server-dir: ${{ secrets.CPANEL_FTP_APP_DIR || './' }}
          dangerous-clean-slate: false
          exclude: |
            **/.env*
            **/storage/**

      - name: 3. Health Check & Verification
        env:
          HEALTH_URL: "https://aiexam.rupakgupta.com/api/health"
          LOGIN_URL: "https://aiexam.rupakgupta.com/en/login"
        run: |
          echo "Waiting 12 seconds for Passenger application worker to reload..."
          sleep 12

          HEALTH_PASSED=false
          for i in {1..8}; do
            echo "Health check attempt $i/8: Requesting $HEALTH_URL..."
            HTTP_STATUS=$(curl -s -o /tmp/health_response.json -w "%{http_code}" "$HEALTH_URL" || echo "000")
            echo "HTTP Status: $HTTP_STATUS"

            if [ "$HTTP_STATUS" = "200" ]; then
              cat /tmp/health_response.json
              echo ""
              HEALTH_PASSED=true
              break
            fi

            echo "Application still reloading... retrying in 5 seconds."
            sleep 5
          done

          if [ "$HEALTH_PASSED" != "true" ]; then
            echo "❌ Health check FAILED after 8 attempts!"
            exit 1
          fi

          echo "Health check: PASS"

          echo "Verifying canonical route $LOGIN_URL..."
          LOGIN_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$LOGIN_URL" || echo "000")
          echo "Login Route HTTP Status: $LOGIN_STATUS"

          echo ""
          echo "=================================================="
          echo "Build: PASS"
          echo "Tests: PASS"
          echo "Artifact: PASS"
          echo "FTPS Upload: PASS"
          echo "Passenger restart: PASS"
          echo "Health check: PASS"
          echo "=================================================="
          echo "Deployment successful"
          echo "Commit: ${{ github.sha }}"
          echo "URL: https://aiexam.rupakgupta.com"
          echo "=================================================="
