name: Production Standalone Build & CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. CI Quality Gates & Next.js Standalone Production Build
  # ============================================================================
  build:
    name: Build & Quality Gates (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Clean Dependency Installation
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate
        env:
          NODE_ENV: production
          DB_HOST: "127.0.0.1"
          DB_PORT: "3306"
          DB_NAME: "build_dummy_db"
          DB_USERNAME: "build_dummy_user"
          DB_PASSWORD: "build_dummy_password"

      - name: Verify Translation Parity (100% EN/HI)
        run: npm run check-translations

      - name: TypeScript Strict Typecheck
        run: npm run typecheck

      - name: ESLint Code Quality Verification
        run: npm run lint

      - name: Execute Vitest Test Suite
        run: npm test

      - name: Compile Next.js Standalone Production Build
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"
          DB_HOST: "127.0.0.1"
          DB_PORT: "3306"
          DB_NAME: "build_dummy_db"
          DB_USERNAME: "build_dummy_user"
          DB_PASSWORD: "build_dummy_password"

      - name: Bundle Standalone Production Assets
        run: |
          echo "Packaging static assets into standalone output..."
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/
          if [ -d "public" ]; then
            cp -r public .next/standalone/
          fi
          # Also include prisma schema and seed engine in standalone bundle for migrations
          mkdir -p .next/standalone/prisma
          cp -r prisma/* .next/standalone/prisma/ 2>/dev/null || true
          cp app.js .next/standalone/ 2>/dev/null || true
          cp package.json .next/standalone/ 2>/dev/null || true

      - name: Upload Standalone Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: exampattern-standalone-artifact
          path: |
            .next/standalone/
            app.js
            deploy.sh
            docs/
          retention-days: 7
          if-no-files-found: error
