name: Production Standalone Build & CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. CI Quality Gates & Next.js Standalone Production Build
  # ============================================================================
  build:
    name: Build & Quality Gates (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Clean Dependency Installation
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate
        env:
          NODE_ENV: production
          DB_HOST: "127.0.0.1"
          DB_PORT: "3306"
          DB_NAME: "build_dummy_db"
          DB_USERNAME: "build_dummy_user"
          DB_PASSWORD: "build_dummy_password"

      - name: Verify Translation Parity (100% EN/HI)
        run: npm run check-translations

      - name: TypeScript Strict Typecheck
        run: npm run typecheck

      - name: ESLint Code Quality Verification
        run: npm run lint

      - name: Execute Vitest Test Suite
        run: npm test

      - name: Compile Next.js Standalone Production Build
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"
          DB_HOST: "127.0.0.1"
          DB_PORT: "3306"
          DB_NAME: "build_dummy_db"
          DB_USERNAME: "build_dummy_user"
          DB_PASSWORD: "build_dummy_password"

      - name: Bundle and Validate Standalone Production Assets
        run: |
          echo "============================================================"
          echo "📦 Packaging Standalone Production Bundle..."
          echo "============================================================"

          # 1. Verify build output prerequisites
          if [ ! -f ".next/standalone/server.js" ]; then
            echo "❌ ERROR: .next/standalone/server.js not found!"
            exit 1
          fi

          if [ ! -d ".next/static" ]; then
            echo "❌ ERROR: .next/static directory not found!"
            exit 1
          fi

          # 2. Copy static assets to .next/standalone/.next/static/
          echo "Copying .next/static to .next/standalone/.next/static..."
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/

          # 3. Copy public directory if present or create if absent
          if [ -d "public" ]; then
            echo "Copying public directory to .next/standalone/public..."
            cp -r public .next/standalone/
          else
            echo "Creating public directory in .next/standalone/public..."
            mkdir -p .next/standalone/public
          fi

          # 4. Copy Prisma schema & migrations (for database maintenance)
          echo "Copying prisma schema & migrations..."
          mkdir -p .next/standalone/prisma
          cp -r prisma/* .next/standalone/prisma/

          # 5. Copy Passenger startup wrapper
          if [ -f "app.js" ]; then
            cp app.js .next/standalone/
          fi

          # 6. Explicit validation checks (fail immediately if any requirement is missing)
          echo ""
          echo "🔍 Validating Standalone Bundle Structure..."
          test -f .next/standalone/server.js || { echo "❌ Missing .next/standalone/server.js"; exit 1; }
          test -f .next/standalone/package.json || { echo "❌ Missing .next/standalone/package.json"; exit 1; }
          test -d .next/standalone/.next/static || { echo "❌ Missing .next/standalone/.next/static"; exit 1; }
          test -d .next/standalone/node_modules || { echo "❌ Missing .next/standalone/node_modules"; exit 1; }
          test -d .next/standalone/messages || { echo "❌ Missing .next/standalone/messages"; exit 1; }
          test -d .next/standalone/prisma || { echo "❌ Missing .next/standalone/prisma"; exit 1; }
          test -d .next/standalone/public || { echo "❌ Missing .next/standalone/public"; exit 1; }

          echo "✅ Standalone bundle validation PASSED!"
          echo ""
          echo "📂 Standalone Root Contents:"
          ls -la .next/standalone/
          echo ""
          echo "📂 Standalone .next Contents:"
          ls -la .next/standalone/.next/
          echo ""
          echo "📂 Standalone .next/static Contents:"
          ls -la .next/standalone/.next/static/

      - name: Upload Standalone Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: exampattern-standalone-artifact
          path: |
            .next/standalone/
            app.js
            deploy.sh
            docs/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
