name: CI & Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ============================================================================
  # 1. CI Validation Pipeline & Next.js Standalone Build
  # ============================================================================
  ci:
    name: Test & Build Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate
        env:
          NODE_ENV: production
          DB_HOST: "127.0.0.1"
          DB_PORT: "3306"
          DB_NAME: "build_dummy_db"
          DB_USERNAME: "build_dummy_user"
          DB_PASSWORD: "build_dummy_password"

      - name: Check Translation Parity
        run: npm run check-translations

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: ESLint Check
        run: npm run lint

      - name: Run Test Suite (Vitest)
        run: npm test

      - name: Build Next.js Application
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"
          DB_HOST: "127.0.0.1"
          DB_PORT: "3306"
          DB_NAME: "build_dummy_db"
          DB_USERNAME: "build_dummy_user"
          DB_PASSWORD: "build_dummy_password"

      - name: Bundle and Validate Standalone Production Assets
        run: |
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/
          if [ -d "public" ]; then
            cp -r public .next/standalone/
          else
            mkdir -p .next/standalone/public
          fi
          mkdir -p .next/standalone/prisma
          cp -r prisma/* .next/standalone/prisma/
          if [ -f "app.js" ]; then
            cp app.js .next/standalone/
          fi
          test -f .next/standalone/server.js
          test -f .next/standalone/package.json
          test -d .next/standalone/.next/static
          test -d .next/standalone/node_modules
          test -d .next/standalone/messages
          test -d .next/standalone/prisma
          test -d .next/standalone/public

      - name: Upload Standalone Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: exampattern-standalone-artifact
          path: |
            .next/standalone/
            app.js
            deploy.sh
            docs/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  # ============================================================================
  # 2. Automated cPanel Deployment via SSH
  # ============================================================================
  deploy:
    name: Deploy to cPanel (Passenger)
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Execute Deployment via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          port: ${{ secrets.CPANEL_SSH_PORT || 22 }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          script_stop: true
          script: |
            echo "Connected to cPanel host. Triggering automated deployment script..."
            cd /home/${{ secrets.CPANEL_USERNAME }}/aiexam.rupakgupta.com
            bash deploy.sh
