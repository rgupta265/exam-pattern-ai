name: CI & Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ============================================================================
  # 1. CI Validation Pipeline (All checks must pass before deployment)
  # ============================================================================
  ci:
    name: Test & Build Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Check Translation Parity
        run: npm run check-translations

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: ESLint Check
        run: npm run lint

      - name: Run Test Suite (Vitest)
        run: npm run test

      - name: Build Next.js Application
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"

  # ============================================================================
  # 2. Automated cPanel Deployment via SSH
  # ============================================================================
  deploy:
    name: Deploy to cPanel (Passenger)
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Execute Deployment via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          port: ${{ secrets.CPANEL_SSH_PORT || 22 }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          script_stop: true
          script: |
            echo "Connected to cPanel host. Triggering automated deployment script..."
            cd /home/${{ secrets.CPANEL_USERNAME }}/aiexam.rupakgupta.com
            bash deploy.sh
